<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>心岛计划 — 探索你的恋爱人格</title>
<style>
/* ============================================ */
/* 心岛计划 — 完整样式表                         */
/* ============================================ */

:root {
  --bg-deep: #0a0e1a;
  --bg-ocean: #0b1a2e;
  --gold: #d4a853;
  --gold-glow: #f0d080;
  --teal: #5abcb9;
  --teal-glow: #8ef0ed;
  --purple: #7b5ea7;
  --purple-glow: #b89ae0;
  --rose: #c9707c;
  --white-soft: #e8e0d8;
  --white-dim: rgba(232,224,216,0.6);
  --white-faint: rgba(232,224,216,0.3);
  --card-bg: rgba(15,20,40,0.75);
  --card-border: rgba(255,255,255,0.08);
  --font-title: 'PingFang SC','Noto Serif SC','STSong',serif;
  --font-body: 'PingFang SC','Noto Sans SC','STHeiti',sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%; overflow:hidden;
  font-family:var(--font-body);
  background:var(--bg-deep);
  color:var(--white-soft);
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  touch-action:manipulation;
}

/* ---- Starfield ---- */
#starfield {
  position:fixed; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:0;
}
.star {
  position:absolute; border-radius:50%; background:white;
  animation: twinkle var(--dur) ease-in-out infinite;
  animation-delay:var(--delay); opacity:0;
}
@keyframes twinkle {
  0%,100% { opacity:0.2; }
  50% { opacity:0.9; }
}

/* ---- Ocean Waves ---- */
#ocean-layer {
  position:fixed; bottom:0; left:0; width:100%; height:30vh;
  pointer-events:none; z-index:0; overflow:hidden;
}
.wave {
  position:absolute; bottom:0; width:200%; height:100%;
  background:linear-gradient(180deg,
    rgba(20,60,100,0) 0%,
    rgba(20,70,120,0.3) 30%,
    rgba(15,50,90,0.6) 60%,
    rgba(10,30,60,0.85) 100%);
  border-radius:40% 40% 0 0;
  animation:waveDrift var(--wv-dur) ease-in-out infinite;
}
.wave:nth-child(1) { animation-duration:7s; opacity:0.6; }
.wave:nth-child(2) { animation-duration:9s; opacity:0.4; animation-delay:-2s; }
.wave:nth-child(3) { animation-duration:12s; opacity:0.25; animation-delay:-5s; }
@keyframes waveDrift {
  0%,100% { transform:translateX(0) translateY(0); }
  25% { transform:translateX(-3%) translateY(-8px); }
  50% { transform:translateX(0) translateY(0); }
  75% { transform:translateX(3%) translateY(-5px); }
}

/* ---- Light Particles (Fireflies) ---- */
.particle {
  position:fixed; pointer-events:none; z-index:1;
  width:3px; height:3px; border-radius:50%;
  background:var(--clr, #f0d080);
  box-shadow:0 0 6px 2px var(--clr, #f0d080);
  animation:floatUp var(--fp-dur) ease-in infinite;
  animation-delay:var(--fp-delay);
  opacity:0;
}
@keyframes floatUp {
  0% { opacity:0; transform:translateY(0) translateX(0) scale(0); }
  10% { opacity:0.8; transform:translateY(-10vh) translateX(5px) scale(1); }
  90% { opacity:0.3; transform:translateY(-80vh) translateX(-15px) scale(0.6); }
  100% { opacity:0; transform:translateY(-100vh) translateX(0) scale(0); }
}

/* ---- Screen Container ---- */
.screen {
  position:fixed; top:0; left:0; width:100%; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:10; transition:opacity 0.8s ease, visibility 0.8s ease;
  padding:24px 20px;
  padding-bottom:calc(24px + var(--safe-bottom));
}
.screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }

/* ============================================ */
/* INTRO SCREEN                                  */
/* ============================================ */
#intro-screen { z-index:20; }

#intro-boat {
  position:absolute; bottom:28vh; left:-80px;
  font-size:40px; animation:boatSail 10s ease-in-out forwards;
  animation-play-state:paused;
}
#intro-boat.sailing { animation-play-state:running; }
@keyframes boatSail {
  0% { left:-80px; bottom:28vh; transform:rotate(-5deg); }
  30% { left:25vw; bottom:26vh; transform:rotate(-2deg) translateY(-6px); }
  60% { left:55vw; bottom:23vh; transform:rotate(2deg) translateY(-3px); }
  80% { left:70vw; bottom:18vh; transform:rotate(0deg) translateY(0); }
  100% { left:85vw; bottom:14vh; transform:rotate(3deg); opacity:0; }
}

#intro-lighthouse {
  position:absolute; right:8vw; top:18vh;
  font-size:56px; opacity:0;
  transition:opacity 1.5s ease;
}
#intro-lighthouse.visible { opacity:1; }

#lighthouse-beam {
  position:absolute; right:calc(8vw + 20px); top:calc(18vh + 10px);
  width:60px; height:60px;
  background:conic-gradient(from 0deg, rgba(240,208,128,0.7) 0deg, rgba(240,208,128,0) 30deg, rgba(240,208,128,0) 330deg, rgba(240,208,128,0.7) 360deg);
  border-radius:50%;
  animation:beamRotate 3s linear infinite;
  opacity:0; transition:opacity 1.5s ease;
}
#lighthouse-beam.visible { opacity:0.9; }
@keyframes beamRotate {
  from { transform:rotate(0deg); }
  to { transform:rotate(360deg); }
}

#intro-moon {
  position:absolute; left:12vw; top:10vh;
  width:60px; height:60px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #ffe9c0 0%, #f0d080 40%, #c9a040 100%);
  box-shadow:0 0 40px 10px rgba(240,208,128,0.3), 0 0 100px 20px rgba(240,208,128,0.1);
  opacity:0; transition:opacity 2s ease;
}
#intro-moon.visible { opacity:1; }

#intro-text-container {
  position:relative; z-index:5; text-align:center;
  opacity:0; transform:translateY(20px);
  transition:opacity 1.2s ease, transform 1.2s ease;
}
#intro-text-container.visible { opacity:1; transform:translateY(0); }

#intro-title {
  font-family:var(--font-title);
  font-size:clamp(28px,7vw,40px);
  color:var(--gold-glow);
  text-shadow:0 0 30px rgba(240,208,128,0.5);
  margin-bottom:12px;
  letter-spacing:4px;
}
#intro-subtitle {
  font-size:clamp(14px,3.5vw,17px);
  color:var(--white-dim);
  letter-spacing:2px;
}

#intro-start-btn {
  position:relative; z-index:5;
  margin-top:40px;
  padding:16px 48px;
  border:1px solid var(--gold);
  border-radius:50px;
  background:rgba(212,168,83,0.1);
  color:var(--gold-glow);
  font-size:clamp(16px,4vw,20px);
  font-family:var(--font-title);
  letter-spacing:3px;
  cursor:pointer;
  opacity:0; transform:translateY(10px);
  transition:opacity 0.8s ease, transform 0.8s ease, background 0.3s ease, box-shadow 0.3s ease;
  animation:pulseGlow 2.5s ease-in-out infinite;
  animation-play-state:paused;
}
#intro-start-btn.visible { opacity:1; transform:translateY(0); animation-play-state:running; }
#intro-start-btn:active { background:rgba(212,168,83,0.25); box-shadow:0 0 30px rgba(212,168,83,0.4); }
@keyframes pulseGlow {
  0%,100% { box-shadow:0 0 10px rgba(212,168,83,0.2); }
  50% { box-shadow:0 0 30px rgba(240,208,128,0.5); }
}

/* ============================================ */
/* GAME SCREEN                                  */
/* ============================================ */
#game-screen { justify-content:flex-start; padding-top:40px; }

#zone-indicator {
  display:flex; align-items:center; gap:6px;
  margin-bottom:10px; opacity:0.7;
  font-size:12px; letter-spacing:2px; color:var(--white-faint);
}
#zone-icon { font-size:18px; }
#zone-name { text-transform:uppercase; }

/* subtle constellation progress */
#constellation-progress {
  display:flex; gap:4px; margin-bottom:20px;
  flex-wrap:wrap; justify-content:center; max-width:280px;
}
.star-dot {
  width:6px; height:6px; border-radius:50%;
  background:var(--white-faint);
  transition:all 0.6s ease;
}
.star-dot.lit { background:var(--gold-glow); box-shadow:0 0 8px var(--gold-glow); }

/* Scene Card */
#scene-card {
  width:100%; max-width:380px;
  background:var(--card-bg);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--card-border);
  border-radius:20px;
  padding:28px 24px;
  transition:opacity 0.35s ease, transform 0.35s ease;
}
#scene-card.transitioning { opacity:0; transform:translateY(15px); }

#scene-narrative {
  font-family:var(--font-title);
  font-size:clamp(15px,3.8vw,18px);
  line-height:1.8;
  color:var(--white-soft);
  margin-bottom:28px;
  text-align:center;
}

#options-container { display:flex; flex-direction:column; gap:12px; }

.option-btn {
  width:100%; padding:16px 20px;
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  background:rgba(255,255,255,0.03);
  color:var(--white-soft);
  font-size:clamp(14px,3.5vw,16px);
  font-family:var(--font-body);
  text-align:left;
  cursor:pointer;
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
  line-height:1.5;
}
.option-btn::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg, rgba(212,168,83,0.08), rgba(122,180,180,0.08));
  opacity:0; transition:opacity 0.3s ease;
}
.option-btn:active::after { opacity:1; }
.option-btn:active {
  border-color:rgba(212,168,83,0.4);
  transform:scale(0.98);
  box-shadow:0 0 20px rgba(212,168,83,0.15);
}
.option-btn .opt-icon {
  display:inline-block; margin-right:8px; font-size:18px; vertical-align:-2px;
}

/* ============================================ */
/* FINAL SCENE — Ancient Tree                    */
/* ============================================ */
#final-screen { z-index:15; }

#ancient-tree {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:280px; height:65vh;
  display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end;
}
.tree-trunk {
  width:24px; height:40%;
  background:linear-gradient(180deg, #3d2b1f 0%, #5c3d2e 40%, #4a3020 100%);
  border-radius:4px 4px 0 0;
  position:relative;
}
.tree-trunk::before {
  content:''; position:absolute; top:10%; left:-20px;
  width:18px; height:30%;
  background:linear-gradient(180deg, #4a3020, #3d2b1f);
  border-radius:0 60% 0 0;
  transform:rotate(-25deg);
}
.tree-trunk::after {
  content:''; position:absolute; top:15%; right:-16px;
  width:16px; height:25%;
  background:linear-gradient(180deg, #4a3020, #3d2b1f);
  border-radius:60% 0 0 0;
  transform:rotate(20deg);
}
.tree-crown {
  width:200px; height:200px;
  background:radial-gradient(ellipse at 50% 40%,
    rgba(30,60,40,0.9) 0%,
    rgba(20,50,30,0.85) 30%,
    rgba(15,35,20,0.7) 60%,
    rgba(10,25,15,0.3) 100%);
  border-radius:50% 50% 45% 45%;
  position:absolute; bottom:35%;
  box-shadow:0 0 60px rgba(100,180,120,0.15);
  animation:treeBreathe 6s ease-in-out infinite;
}
@keyframes treeBreathe {
  0%,100% { transform:scale(1); }
  50% { transform:scale(1.03); }
}

/* Glowing Fruit */
#glowing-fruit {
  position:absolute;
  width:40px; height:40px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffd89b, #f0984a 50%, #c0392b 100%);
  box-shadow:0 0 30px rgba(240,152,74,0.7), 0 0 80px rgba(240,152,74,0.3);
  z-index:5; cursor:pointer;
  animation:fruitGlow 2s ease-in-out infinite, fruitHover 3s ease-in-out infinite;
  transition:transform 0.3s ease;
}
#glowing-fruit:active { transform:scale(1.2); }
@keyframes fruitGlow {
  0%,100% { box-shadow:0 0 30px rgba(240,152,74,0.7), 0 0 80px rgba(240,152,74,0.3); }
  50% { box-shadow:0 0 50px rgba(255,200,120,0.9), 0 0 120px rgba(240,152,74,0.5); }
}
@keyframes fruitHover {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-8px); }
}

#fruit-fall-hint {
  position:absolute; bottom:20%;
  color:var(--white-dim); font-size:13px;
  letter-spacing:2px; text-align:center;
  animation:hintPulse 2s ease-in-out infinite;
  z-index:4;
}
@keyframes hintPulse {
  0%,100% { opacity:0.4; }
  50% { opacity:1; }
}

/* ============================================ */
/* RESULT SCREEN                                */
/* ============================================ */
#result-screen {
  overflow-y:auto; justify-content:flex-start;
  padding-top:30px; padding-bottom:60px;
}

#result-card {
  width:100%; max-width:400px;
  background:var(--card-bg);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--card-border);
  border-radius:24px;
  padding:32px 22px;
  text-align:center;
}

#result-personality-name {
  font-family:var(--font-title);
  font-size:clamp(24px,6vw,34px);
  color:var(--gold-glow);
  text-shadow:0 0 20px rgba(240,208,128,0.4);
  margin-bottom:8px;
  letter-spacing:3px;
}

#result-hit-line {
  font-size:clamp(14px,3.5vw,16px);
  color:var(--teal-glow);
  font-style:italic;
  margin-bottom:24px;
  line-height:1.6;
}

.result-section {
  text-align:left; margin-bottom:20px;
}
.result-section h3 {
  font-family:var(--font-title);
  font-size:15px; color:var(--gold);
  margin-bottom:8px; letter-spacing:2px;
  display:flex; align-items:center; gap:6px;
}
.result-section h3 .sec-icon { font-size:18px; }
.result-section p {
  font-size:14px; line-height:1.7;
  color:var(--white-dim); padding-left:4px;
}

#result-tags { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:24px; }
.result-tag {
  padding:6px 16px; border-radius:20px;
  font-size:13px; letter-spacing:1px;
  border:1px solid;
}
.tag-match { border-color:var(--teal); color:var(--teal-glow); background:rgba(90,188,185,0.1); }
.tag-danger { border-color:var(--rose); color:#e8a0a8; background:rgba(201,112,124,0.1); }

#result-restart-btn {
  margin-top:16px; padding:12px 36px;
  border:1px solid var(--gold);
  border-radius:50px;
  background:rgba(212,168,83,0.08);
  color:var(--gold-glow);
  font-size:15px; letter-spacing:2px;
  cursor:pointer;
  font-family:var(--font-title);
  transition:all 0.3s ease;
}
#result-restart-btn:active { background:rgba(212,168,83,0.2); }

/* ============================================ */
/* RESPONSIVE                                   */
/* ============================================ */
@media (max-width:360px) {
  #scene-card { padding:20px 16px; }
  .option-btn { padding:14px 16px; }
}

@media (min-height:800px) {
  #game-screen { padding-top:60px; }
}
</style>
</head>
<body>

<!-- Stars Container -->
<div id="starfield"></div>

<!-- Ocean Waves -->
<div id="ocean-layer">
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</div>

<!-- Particle Layer -->
<div id="particle-layer"></div>

<!-- ============================================ -->
<!-- INTRO SCREEN                                 -->
<!-- ============================================ -->
<div id="intro-screen" class="screen">
  <div id="intro-moon"></div>
  <div id="intro-lighthouse">🏛️</div>
  <div id="lighthouse-beam"></div>
  <div id="intro-boat">⛵</div>
  <div id="intro-text-container">
    <div id="intro-title">心 岛 计 划</div>
    <div id="intro-subtitle">在这座岛上，遇见真实的自己</div>
  </div>
  <button id="intro-start-btn">开 始 探 索</button>
</div>

<!-- ============================================ -->
<!-- GAME SCREEN                                  -->
<!-- ============================================ -->
<div id="game-screen" class="screen hidden">
  <div id="zone-indicator">
    <span id="zone-icon">🏝️</span>
    <span id="zone-name">海岸</span>
  </div>
  <div id="constellation-progress"></div>
  <div id="scene-card">
    <div id="scene-narrative"></div>
    <div id="options-container"></div>
  </div>
</div>

<!-- ============================================ -->
<!-- FINAL SCREEN — Ancient Tree                  -->
<!-- ============================================ -->
<div id="final-screen" class="screen hidden">
  <div id="ancient-tree">
    <div class="tree-crown"></div>
    <div class="tree-trunk"></div>
  </div>
  <div id="glowing-fruit" style="top:22%; left:50%; transform:translateX(-50%);"></div>
  <div id="fruit-fall-hint">✨ 点击果实 · 揭晓答案 ✨</div>
</div>

<!-- ============================================ -->
<!-- RESULT SCREEN                               -->
<!-- ============================================ -->
<div id="result-screen" class="screen hidden">
  <div id="result-card"></div>
  <button id="result-restart-btn">再 次 探 索</button>
</div>

<script>

  {
    id:5, zone:'coast',
    narrative:'潮水开始上涨，你发现了一处隐藏在礁石后的岩洞。洞口低矮，需要弯腰才能进入，里面隐约透出微光……',

    ]
  },

// ============================================
// 应用状态
// ============================================
const state = {
  phase: 'intro',           // 'intro' | 'exploring' | 'final' | 'result'
  currentSceneIndex: 0,
  scores: { S:0, F:0, E:0, A:0 },
  resultPersonality: null
};

// ============================================
// DOM 引用
// ============================================
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const dom = {
  introScreen: $('#intro-screen'),
  introMoon: $('#intro-moon'),
  introLighthouse: $('#intro-lighthouse'),
  lighthouseBeam: $('#lighthouse-beam'),
  introBoat: $('#intro-boat'),
  introText: $('#intro-text-container'),
  introStartBtn: $('#intro-start-btn'),
  gameScreen: $('#game-screen'),
  sceneCard: $('#scene-card'),
  sceneNarrative: $('#scene-narrative'),
  optionsContainer: $('#options-container'),
  zoneIcon: $('#zone-icon'),
  zoneName: $('#zone-name'),
  constellationProgress: $('#constellation-progress'),
  finalScreen: $('#final-screen'),
  glowingFruit: $('#glowing-fruit'),
  fruitFallHint: $('#fruit-fall-hint'),
  resultScreen: $('#result-screen'),
  resultCard: $('#result-card'),
  resultRestartBtn: $('#result-restart-btn'),
  starfield: $('#starfield'),
  particleLayer: $('#particle-layer')
};

// ============================================
// 星空生成
// ============================================
function createStarfield() {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 120; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 0.8;
    star.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random() * 100}%;
      left:${Math.random() * 100}%;
      --dur:${Math.random() * 3 + 2}s;
      --delay:${Math.random() * 5}s;
    `;
    frag.appendChild(star);
  }
  dom.starfield.appendChild(frag);
}

// ============================================
// 粒子（萤火虫）生成
// ============================================
let particleInterval = null;

function startParticles(color = '#f0d080') {
  stopParticles();
  particleInterval = setInterval(() => {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left:${Math.random() * 90 + 5}%;
      bottom:-10px;
      --clr:${color};
      --fp-dur:${Math.random() * 6 + 6}s;
      --fp-delay:0s;
    `;
    dom.particleLayer.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
    // Limit particles
    if (dom.particleLayer.children.length > 30) {
      dom.particleLayer.firstChild.remove();
    }
  }, 800);
}

function stopParticles() {
  if (particleInterval) { clearInterval(particleInterval); particleInterval = null; }
  dom.particleLayer.innerHTML = '';
}

function updateParticleColor(color) {
  stopParticles();
  startParticles(color);
}

// ============================================
// 序章动画
// ============================================
function runIntro() {
  // Phase 1: Moon appears (0s)
  setTimeout(() => dom.introMoon.classList.add('visible'), 300);

  // Phase 2: Lighthouse appears (1.5s)
  setTimeout(() => {
    dom.introLighthouse.classList.add('visible');
    dom.lighthouseBeam.classList.add('visible');
  }, 1500);

  // Phase 3: Boat starts sailing (2s)
  setTimeout(() => {
    dom.introBoat.classList.add('sailing');
  }, 2000);

  // Phase 4: After boat journey, show text (8s)
  setTimeout(() => {
    dom.introText.classList.add('visible');
  }, 8000);

  // Phase 5: Show start button (10s)
  setTimeout(() => {
    dom.introStartBtn.classList.add('visible');
  }, 10000);
}

// ============================================
// 场景渲染
// ============================================
function getZoneInfo(zone) {
  const map = {
    coast:     { icon:'🏝️', name:'海岸', particleColor:'#8ef0ed' },
    forest:    { icon:'🌲', name:'森林', particleColor:'#b89ae0' },
    mountain:  { icon:'🏔️', name:'山与湖', particleColor:'#f0d080' },
    lighthouse:{ icon:'🗼', name:'灯塔', particleColor:'#ffd89b' }
  };
  return map[zone] || map.coast;
}

function updateBackgroundForZone(zone) {
  const zi = getZoneInfo(zone);
  dom.zoneIcon.textContent = zi.icon;
  dom.zoneName.textContent = zi.name;
  // Update particle color
  updateParticleColor(zi.particleColor);

  // Update ocean gradient based on zone
  const waves = $$('#ocean-layer .wave');
  const gradients = {
    coast: [
      'linear-gradient(180deg, rgba(20,60,100,0) 0%, rgba(20,70,120,0.3) 30%, rgba(15,50,90,0.6) 60%, rgba(10,30,60,0.85) 100%)',
      'linear-gradient(180deg, rgba(20,60,100,0) 0%, rgba(20,70,120,0.2) 30%, rgba(15,50,90,0.4) 60%, rgba(10,30,60,0.7) 100%)',
      'linear-gradient(180deg, rgba(20,60,100,0) 0%, rgba(20,70,120,0.15) 30%, rgba(15,50,90,0.3) 60%, rgba(10,30,60,0.55) 100%)'
    ],
    forest: [
      'linear-gradient(180deg, rgba(15,40,25,0) 0%, rgba(25,55,35,0.3) 30%, rgba(15,35,25,0.6) 60%, rgba(10,25,15,0.85) 100%)',
      'linear-gradient(180deg, rgba(15,40,25,0) 0%, rgba(25,55,35,0.2) 30%, rgba(15,35,25,0.4) 60%, rgba(10,25,15,0.7) 100%)',
      'linear-gradient(180deg, rgba(15,40,25,0) 0%, rgba(25,55,35,0.15) 30%, rgba(15,35,25,0.3) 60%, rgba(10,25,15,0.55) 100%)'
    ],
    mountain: [
      'linear-gradient(180deg, rgba(25,20,50,0) 0%, rgba(35,25,60,0.3) 30%, rgba(20,15,45,0.6) 60%, rgba(15,10,35,0.85) 100%)',
      'linear-gradient(180deg, rgba(25,20,50,0) 0%, rgba(35,25,60,0.2) 30%, rgba(20,15,45,0.4) 60%, rgba(15,10,35,0.7) 100%)',
      'linear-gradient(180deg, rgba(25,20,50,0) 0%, rgba(35,25,60,0.15) 30%, rgba(20,15,45,0.3) 60%, rgba(15,10,35,0.55) 100%)'
    ],
    lighthouse: [
      'linear-gradient(180deg, rgba(20,25,45,0) 0%, rgba(30,35,55,0.3) 30%, rgba(20,25,40,0.6) 60%, rgba(10,15,30,0.85) 100%)',
      'linear-gradient(180deg, rgba(20,25,45,0) 0%, rgba(30,35,55,0.2) 30%, rgba(20,25,40,0.4) 60%, rgba(10,15,30,0.7) 100%)',
      'linear-gradient(180deg, rgba(20,25,45,0) 0%, rgba(30,35,55,0.15) 30%, rgba(20,25,40,0.3) 60%, rgba(10,15,30,0.55) 100%)'
    ]
  };
  const gset = gradients[zone] || gradients.coast;
  waves.forEach((w, i) => { w.style.background = gset[i] || gset[0]; });
}

function updateConstellationProgress() {
  const total = scenes.length;
  const done = state.currentSceneIndex;
  let html = '';
  for (let i = 0; i < total; i++) {
    html += `<div class="star-dot${i < done ? ' lit' : ''}"></div>`;
  }
  dom.constellationProgress.innerHTML = html;
}

function renderScene() {
  if (state.currentSceneIndex >= scenes.length) {
    showFinalScene();
    return;
  }
  const scene = scenes[state.currentSceneIndex];
  updateBackgroundForZone(scene.zone);
  updateConstellationProgress();

  dom.sceneNarrative.textContent = scene.narrative;
  dom.optionsContainer.innerHTML = '';

  scene.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-icon">${opt.icon}</span>${opt.text}`;
    btn.addEventListener('click', () => selectOption(scene, idx));
    dom.optionsContainer.appendChild(btn);
  });

  // Fade in card
  dom.sceneCard.classList.remove('transitioning');
}

function selectOption(scene, optionIndex) {
  const chosen = scene.options[optionIndex];
  // Update scores
  for (const dim of ['S','F','E','A']) {
    state.scores[dim] += (chosen.scores[dim] || 0);
  }

  // Transition out
  dom.sceneCard.classList.add('transitioning');

  // Advance to next scene
  setTimeout(() => {
    state.currentSceneIndex++;
    renderScene();
  }, 400);
}

// ============================================
// 最终场景 — 古树 & 果实
// ============================================
function showFinalScene() {
  stopParticles();
  dom.gameScreen.classList.add('hidden');
  dom.finalScreen.classList.remove('hidden');
  state.phase = 'final';

  // Position the fruit on the tree
  const fruit = dom.glowingFruit;
  fruit.style.top = '28%';
  fruit.style.left = '50%';
  fruit.style.transform = 'translateX(-50%)';
  fruit.style.cursor = 'pointer';

  dom.fruitFallHint.style.opacity = '1';

  // Fruit drop animation after a brief moment
  setTimeout(() => {
    fruit.style.transition = 'top 1.5s cubic-bezier(0.25, 0.8, 0.25, 1.2)';
    fruit.style.top = '50%';
    fruit.style.boxShadow = '0 0 50px rgba(240,152,74,0.9), 0 0 120px rgba(240,152,74,0.5)';
  }, 800);

  fruit.addEventListener('click', revealResult);
}

function revealResult() {
  dom.glowingFruit.removeEventListener('click', revealResult);
  const personality = calculatePersonality();
  state.resultPersonality = personality;

  // Flash effect
  dom.glowingFruit.style.transition = 'all 0.5s ease';
  dom.glowingFruit.style.transform = 'translateX(-50%) scale(3)';
  dom.glowingFruit.style.opacity = '0';

  setTimeout(() => {
    dom.finalScreen.classList.add('hidden');
    dom.resultScreen.classList.remove('hidden');
    state.phase = 'result';
    renderResult(personality);
  }, 600);
}

// ============================================
// 人格匹配算法
// ============================================
function calculatePersonality() {
  // Normalize scores (max possible per dimension = 2 * 24 = 48)
  const maxPossible = 48;
  const userProfile = {
    S: Math.min(1, state.scores.S / maxPossible),
    F: Math.min(1, state.scores.F / maxPossible),
    E: Math.min(1, state.scores.E / maxPossible),
    A: Math.min(1, state.scores.A / maxPossible)
  };

  // Rescale to emphasize differences
  // Map from [0,1] to ensure good spread
  const rescale = (v) => v;

  // Find closest personality by Euclidean distance
  let bestDist = Infinity;
  let bestMatch = personalities[0];

  for (const p of personalities) {
    const dS = rescale(userProfile.S) - p.profile.S;
    const dF = rescale(userProfile.F) - p.profile.F;
    const dE = rescale(userProfile.E) - p.profile.E;
    const dA = rescale(userProfile.A) - p.profile.A;
    const dist = Math.sqrt(dS*dS + dF*dF + dE*dE + dA*dA);
    if (dist < bestDist) {
      bestDist = dist;
      bestMatch = p;
    }
  }

  return bestMatch;
}

// ============================================
// 结果页渲染
// ============================================
function renderResult(personality) {
  const matchTags = personality.matches.map(n =>
    `<span class="result-tag tag-match">💚 ${n}</span>`
  ).join('');
  const dangerTags = personality.dangers.map(n =>
    `<span class="result-tag tag-danger">⚠️ ${n}</span>`
  ).join('');

  dom.resultCard.innerHTML = `
    <div id="result-personality-name">${personality.name}</div>
    <div id="result-hit-line">"${personality.hitLine}"</div>

    <div class="result-section">
      <h3><span class="sec-icon">🎨</span>人格画像</h3>
      <p>${personality.portrait}</p>
    </div>

    <div class="result-section">
      <h3><span class="sec-icon">💞</span>恋爱模式</h3>
      <p>${personality.loveMode}</p>
    </div>

    <div class="result-section">
      <h3><span class="sec-icon">✨</span>优势</h3>
      <p>${personality.strengths}</p>
    </div>

    <div class="result-section">
      <h3><span class="sec-icon">🌑</span>盲区</h3>
      <p>${personality.blindSpots}</p>
    </div>

    <div id="result-tags">
      ${matchTags}
      ${dangerTags}
    </div>

    <div class="result-section">
      <h3><span class="sec-icon">🌱</span>成长建议</h3>
      <p>${personality.growthTips}</p>
    </div>
  `;

  // Update background for result
  updateParticleColor('#f0d080');
  // Scroll to top
  dom.resultScreen.scrollTop = 0;
}

// ============================================
// 屏幕切换
// ============================================
function showScreen(screen) {
  ['introScreen','gameScreen','finalScreen','resultScreen'].forEach(k => {
    dom[k].classList.add('hidden');
  });
  screen.classList.remove('hidden');
}

// ============================================
// 事件绑定 & 初始化
// ============================================
function init() {
  createStarfield();
  startParticles('#8ef0ed');

  // Intro start button
  dom.introStartBtn.addEventListener('click', () => {
    state.phase = 'exploring';
    dom.introScreen.classList.add('hidden');
    dom.gameScreen.classList.remove('hidden');
    dom.introBoat.classList.remove('sailing'); // reset
    updateConstellationProgress();
    renderScene();
  });

  // Restart button
  dom.resultRestartBtn.addEventListener('click', () => {
    state.phase = 'exploring';
    state.currentSceneIndex = 0;
    state.scores = { S:0, F:0, E:0, A:0 };
    state.resultPersonality = null;
    dom.resultScreen.classList.add('hidden');
    dom.finalScreen.classList.add('hidden');
    dom.gameScreen.classList.remove('hidden');
    // Reset fruit
    const fruit = dom.glowingFruit;
    fruit.style.transition = 'none';
    fruit.style.top = '28%';
    fruit.style.left = '50%';
    fruit.style.transform = 'translateX(-50%)';
    fruit.style.opacity = '1';
    fruit.style.boxShadow = '0 0 30px rgba(240,152,74,0.7), 0 0 80px rgba(240,152,74,0.3)';
    fruit.addEventListener('click', revealResult);
    dom.fruitFallHint.style.opacity = '1';
    updateConstellationProgress();
    renderScene();
  });

  // Run intro animation
  runIntro();
}

// Start the app
document.addEventListener('DOMContentLoaded', init);
</script>
