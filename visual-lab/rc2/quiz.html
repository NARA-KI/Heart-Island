<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心岛 V2 RC2.0 视觉基准 / 答题页</title>
    <link rel="stylesheet" href="./rc2-tokens.css" />
    <link rel="stylesheet" href="./rc2-layout.css" />
    <link rel="stylesheet" href="./rc2-pages.css" />
  </head>
  <body class="rc2-page rc2-quiz">
    <main class="rc2-quiz-shell">
      <header class="rc2-log-head">
        <div>
          <strong>HEART ISLAND / RELATIONSHIP LOG</strong>
          <span>航程 01 / 05</span>
        </div>
        <span>QUESTION 01 / 60</span>
      </header>
      <section class="rc2-quiz-main">
        <aside class="rc2-question-index" aria-label="当前题号">
          <b class="rc2-serif">01</b>
          <p>近岸灯标旁，一段关系刚开始靠近。</p>
        </aside>
        <div class="rc2-question-copy">
          <p class="rc2-file-code">SC / STATUS CLARITY</p>
          <h1 class="rc2-serif">
            在近岸灯标旁，你想起一段刚开始靠近的关系。对方没有明确说过你们现在算什么，你通常更在意什么？
          </h1>
          <div class="rc2-options" role="radiogroup" aria-label="答题选项">
            <button class="rc2-option" type="button" data-option="A"><span>A</span><span>我会先观察相处，不急着要一个说法。</span></button>
            <button class="rc2-option is-selected" type="button" data-option="B"><span>B</span><span>我希望至少知道对方是不是认真靠近。</span></button>
            <button class="rc2-option" type="button" data-option="C"><span>C</span><span>我会直接问清楚，不想长期猜。</span></button>
            <button class="rc2-option" type="button" data-option="D"><span>D</span><span>我更看行动，暂时不需要语言确认。</span></button>
          </div>
        </div>
      </section>
      <footer class="rc2-quiz-foot">
        <a class="rc2-button rc2-button--ghost" href="./index.html">上一页</a>
        <span>选择后自动进入下一题，答案会在本地保存。</span>
      </footer>
    </main>
    <script src="./rc2-demo.js"></script>
  </body>
</html>
